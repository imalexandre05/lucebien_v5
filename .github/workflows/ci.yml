name: CI

# Verificación en cada push a main y en cada PR: typecheck del ERP nuevo + los tests
# unitarios de la lógica de negocio (@scilb/core). Sin secretos (no corre build ni E2E,
# que necesitan las claves de Supabase / un preview) → siempre reproducible.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck + tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el Zone Guard recorre los commits del PR

      # Los no-negociables de CLAUDE.md, comprobados por una máquina y no por la memoria de
      # quien revisa. La deuda previa vive en tools/guard-baseline.txt y no rompe el build;
      # una violación nueva sí. Va primero porque es lo más barato de todo el job.
      - name: Guard de no-negociables
        run: bash tools/guard-reglas.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # El repo antiguo tiene node_modules versionado (deps del Express); se limpia para que
      # pnpm arme su estructura desde cero y no choque con el node_modules commiteado.
      - name: Instalar dependencias
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          pnpm install --frozen-lockfile

      - name: Typecheck (erp-web + core/adapter por imports)
        run: pnpm --filter erp-web exec tsc --noEmit

      - name: Tests unitarios (@scilb/core)
        run: pnpm --filter @scilb/core test

  # Quinta red: Semgrep CE (gratis, sin login ni token). Reglas de la comunidad + las propias de
  # .semgrep/sci-lb.yml, que espejan no-negociables del guard con análisis de AST.
  # Sólo rompe lo NUEVO: --baseline-commit compara contra la base (el PR, o el push anterior), igual
  # que tools/guard-baseline.txt. Lo que ya existía queda como deuda conocida, no se silencia.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --baseline-commit necesita la historia

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          baseline=""
          case "$BASE_SHA" in ""|0000000000000000000000000000000000000000) ;; *) baseline="--baseline-commit $BASE_SHA" ;; esac
          semgrep scan --error $baseline \
            --config p/typescript --config p/nextjs --config p/secrets --config .semgrep/ \
            apps packages
